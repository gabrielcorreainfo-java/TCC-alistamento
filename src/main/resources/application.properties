spring.datasource.url=jdbc:mysql://127.0.0.1:3306/alistamento_militar
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Spring confere se as tabelas batem com as classes
spring.jpa.hibernate.ddl-auto=validate

# Fecha a conexão com o banco assim que o service termina
spring.jpa.open-in-view=false
spring.jpa.show-sql=${MOSTRAR_SQL:false}


# A chave que assina o token
api.security.token.secret=${JWT_SECRET}

# Chave que criptografa CPF, RG e CEP
api.cripto.chave=${CRIPTO_CHAVE}

# Primeiro administrador, criado automaticamente se o banco não tiver nenhum
api.admin.nome=${ADMIN_NOME:Administrador Geral}
api.admin.email=${ADMIN_EMAIL:admin@alistamento.com}
api.admin.senha=${ADMIN_SENHA:}

# Endereços do front que podem acessar a API (separados por vírgula)
api.cors.origens=${CORS_ORIGENS:http://localhost:4200}

# A pasta onde ficam os PDFs e as fotos dos documentos
api.arquivos.pasta=${PASTA_ARQUIVOS:uploads/documentos}

# Reusa arquivos maiores que 5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# O endereço do servidor de e-mail. Padrão: o do Gmail (smtp.gmail.com)
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}

# A porta do servidor. A 587 é a padrão para envio com criptografia
spring.mail.port=${EMAIL_PORTA:587}

# A conta que vai enviar junto com a senha
spring.mail.username=${EMAIL_USUARIO:}
spring.mail.password=${EMAIL_SENHA:}

# O servidor exige login para enviar
spring.mail.properties.mail.smtp.auth=true

# A conexão com o servidor é criptografada
spring.mail.properties.mail.smtp.starttls.enable=true

