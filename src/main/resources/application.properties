spring.datasource.url=jdbc:mysql://127.0.0.1:3306/alistamento_militar
spring.datasource.username=root
spring.datasource.password=fitodb
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Consulta nossas variáveis de ambiente - JWT_SECRET
api.security.token.secret=${JWT_SECRET:mq-secret-key}

# Primeiro administrador, criado automaticamente se o banco não tiver nenhum
api.admin.nome=${ADMIN_NOME:Administrador Geral}
api.admin.email=${ADMIN_EMAIL:admin@alistamento.com}
api.admin.senha=${ADMIN_SENHA:admin@2026}

# Endereços do front que podem acessar a API (separados por vírgula)
api.cors.origens=${CORS_ORIGENS:http://localhost:4200}